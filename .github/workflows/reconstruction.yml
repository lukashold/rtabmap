name: Photo reconstruction
on:
  push:
    branches: ['kantura/main']
    paths: ['tools/reconstruction/**', 'tools/panorama/**', 'tools/generation/**', 'tools/validation/**', '.github/workflows/reconstruction.yml']
  pull_request:
    paths: ['tools/reconstruction/**', 'tools/panorama/**', 'tools/generation/**', 'tools/validation/**', '.github/workflows/reconstruction.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: reconstruction-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image and synthetic validation dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install -r tools/reconstruction/requirements.txt -r tools/validation/requirements.txt
      - name: Test archive and job contracts
        run: python -m unittest discover -s tools/reconstruction/test -v
      - name: Test independent quality evaluator
        run: python -m unittest discover -s tools/validation/test -v
      - name: Generate original synthetic multi-view photos
        run: |
          python tools/validation/procedural-capture.py --output /tmp/synthetic-photos.zip --truth /tmp/synthetic-truth.json
          python tools/validation/procedural-distinct.py --output /tmp/distinct-photos.zip --truth /tmp/distinct-truth.json
          python tools/validation/generation-fixture.py --output /tmp/generated-input.png
      - uses: docker/setup-buildx-action@v3
      - name: Build actual CPU reconstruction engines
        uses: docker/build-push-action@v6
        with:
          context: tools/reconstruction
          file: tools/reconstruction/Dockerfile
          build-contexts: |
            panorama=tools/panorama
            generation=tools/generation
          build-args: |
            ENABLE_GENERATION=1
          platforms: linux/amd64
          load: true
          tags: kantura-reconstruction:ci
          cache-from: type=gha,scope=kantura-reconstruction-cpu
          cache-to: type=gha,mode=max,scope=kantura-reconstruction-cpu
      - name: Start private real worker
        env:
          RECONSTRUCTION_TOKEN: ci-synthetic-data-only-token-32-characters
        run: |
          docker run -d --name kantura-reconstruction --read-only --cap-drop ALL \
            --security-opt no-new-privileges --cpus=2 --memory=12g \
            --mount type=volume,source=kantura-reconstruction-ci,target=/data \
            --tmpfs /tmp:rw,nosuid,size=1g \
            -p 127.0.0.1:4180:4180 \
            -e RECONSTRUCTION_TOKEN -e SPLAT_ITERATIONS=300 -e SPLAT_DOWNSCALE=2 -e SPLAT_VALIDATE=1 \
            -e SFM_CAMERA_POLICY=single -e IMAGE_MAX_SIDE=384 \
            -e WORKER_THREADS=2 kantura-reconstruction:ci
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4180/health; then exit 0; fi
            sleep 2
          done
          docker logs kantura-reconstruction
          exit 1
      - name: Test real video decoding in the pinned FFmpeg image
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,size=512m --entrypoint python3 \
            --mount type=bind,source="$PWD/tools/reconstruction/test",target=/opt/kantura/test,readonly \
            kantura-reconstruction:ci -m unittest discover -s /opt/kantura/test -p test_media.py -v
      - name: Run real photogrammetry and Gaussian-splat processing
        env:
          RECONSTRUCTION_TOKEN: ci-synthetic-data-only-token-32-characters
        run: |
          python tools/validation/capture-video.py --archive /tmp/synthetic-photos.zip --output /tmp/synthetic-video.mp4
          docker exec kantura-reconstruction /opt/kantura-panorama-env/bin/python -c "import sys;sys.path.insert(0,'/opt/kantura/capture-engines/panorama');from synthetic import write_fixture;write_fixture('/data/panorama-fixture.zip')"
          docker cp kantura-reconstruction:/data/panorama-fixture.zip /tmp/panorama-fixture.zip
          python tools/validation/reconstruction-smoke.py --archive /tmp/synthetic-photos.zip --distinct /tmp/distinct-photos.zip --video /tmp/synthetic-video.mp4 --panorama /tmp/panorama-fixture.zip --image /tmp/generated-input.png --output reconstruction-smoke --timeout 2400
      - name: Measure synthetic camera and cube reconstruction quality
        if: always()
        run: |
          for prefix in "" distinct-; do
            truth=/tmp/synthetic-truth.json
            if [ "$prefix" = distinct- ]; then truth=/tmp/distinct-truth.json; fi
            if [ -f "reconstruction-smoke/${prefix}mesh/model.ply" ]; then
              python tools/validation/reconstruction-quality.py --truth "$truth" --cameras "reconstruction-smoke/${prefix}mesh/cameras.json" --mesh "reconstruction-smoke/${prefix}mesh/model.ply" --output "reconstruction-smoke/${prefix}mesh-quality.json"
            fi
            if [ -f "reconstruction-smoke/${prefix}splat/cameras.json" ]; then
              python tools/validation/reconstruction-quality.py --truth "$truth" --cameras "reconstruction-smoke/${prefix}splat/cameras.json" --output "reconstruction-smoke/${prefix}splat-camera-quality.json"
            fi
          done
          if [ -d reconstruction-smoke ]; then
            cp /tmp/synthetic-truth.json reconstruction-smoke/synthetic-truth.json
            cp /tmp/distinct-truth.json reconstruction-smoke/distinct-truth.json
          fi
      - name: Worker diagnostics
        if: always()
        run: |
          docker logs --tail 100 kantura-reconstruction || true
          docker exec -i kantura-reconstruction python3 - < tools/validation/print-worker-diagnostics.py || true
      - name: Save real synthetic pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-reconstruction-results
          path: reconstruction-smoke
          if-no-files-found: ignore
      - name: Remove validation container
        if: always()
        run: docker rm -f kantura-reconstruction || true
