<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="RTAB-Map: Scans ansehen, Strecken und Flächen messen, Grundrisse exportieren."><title>Kantura · Scan & Measure</title><link rel="icon" type="image/svg+xml" href="./kantura.svg"><link rel="stylesheet" href="./style.css"></head>
<body>
  <header class="header">
    <a class="brand" href="./" aria-label="Kantura"><img class="brand-mark" src="./kantura.svg" alt=""><span>Kantura <small>SCAN · MEASURE</small></span></a>
    <nav class="header-nav" aria-label="Kantura"><button id="home-nav" class="quiet" data-i18n="home"></button><button id="learn-nav" class="quiet" data-i18n="learn"></button><a href="https://github.com/lukashold/rtabmap/blob/kantura/main/CONTRIBUTING.md" target="_blank" rel="noopener noreferrer" data-i18n="community"></a></nav>
    <div class="header-actions"><select id="language" aria-label="Language"><option value="de">Deutsch</option><option value="en">English</option><option value="fr">Français</option><option value="es">Español</option><option value="it">Italiano</option><option value="zh-Hans">简体中文</option></select><button id="tutorial" class="quiet"><span data-icon="book"></span><span data-i18n="tutorial"></span></button><button id="save" class="primary" disabled><span data-icon="save"></span><span data-i18n="save"></span></button></div>
  </header>
  <section id="home-screen" class="home-screen">
    <div class="home-hero"><div class="home-copy"><p class="eyebrow" data-i18n="heroEyebrow"></p><h1 data-i18n="heroTitle"></h1><p class="home-description" data-i18n="heroBody"></p><div class="home-ctas"><button id="home-open" class="primary"><span data-icon="folder"></span><span data-i18n="openProject"></span></button><button id="home-demo" class="quiet" data-i18n="startExample"></button></div><button id="return-workspace" class="text-button" data-i18n="backToWorkspace" hidden></button><p class="home-privacy"><span class="privacy-dot"></span><span data-i18n="localFirst"></span></p></div><div class="home-art"><img src="./videos/poster.svg" alt="" width="1280" height="720"><button id="hero-video" class="video-pill"><span class="play-symbol" aria-hidden="true">▶</span><span data-i18n="watchVideo"></span></button></div></div>
    <div class="paths-heading"><h2 data-i18n="choosePath"></h2><span>01 — 03</span></div>
    <div class="path-cards"><button class="path-card" data-entry="room"><span class="path-icon" data-icon="floor"></span><span class="path-number">01</span><strong data-i18n="roomCard"></strong><span class="path-description" data-i18n="roomBody"></span><span class="path-arrow" aria-hidden="true">↗</span></button><button class="path-card" data-entry="house"><span class="path-icon" data-icon="layers"></span><span class="path-number">02</span><strong data-i18n="houseCard"></strong><span class="path-description" data-i18n="houseBody"></span><span class="path-arrow" aria-hidden="true">↗</span></button><button class="path-card" data-entry="object"><span class="path-icon" data-icon="cube"></span><span class="path-number">03</span><strong data-i18n="objectCard"></strong><span class="path-description" data-i18n="objectBody"></span><span class="path-arrow" aria-hidden="true">↗</span></button></div>
    <div class="home-bottom"><div class="learning-card"><span class="eyebrow" data-i18n="learn"></span><h2 data-i18n="videoTitle"></h2><p data-i18n="videoBody"></p><button id="home-video" class="quiet"><span class="play-symbol" aria-hidden="true">▶</span><span data-i18n="watchVideo"></span></button></div><div class="community-card"><span class="eyebrow">OPEN SOURCE</span><h2 data-i18n="contributeTitle"></h2><p data-i18n="contributeBody"></p><a href="https://github.com/lukashold/rtabmap/blob/kantura/main/CONTRIBUTING.md" target="_blank" rel="noopener noreferrer" data-i18n="contributeLink"></a><div class="language-pills" aria-label="Languages"><span>DE</span><span>EN</span><span>FR</span><span>ES</span><span>IT</span><span>中文</span></div></div></div>
  </section>
  <nav class="workflow" aria-label="Workflow"><button data-guide-step="1"><b>1</b><span id="step-scan"></span></button><span>—</span><button data-guide-step="2"><b>2</b><span id="step-review"></span></button><span>—</span><button data-guide-step="3" class="current"><b>3</b><span data-i18n="workspace"></span></button><span>—</span><button data-guide-step="6"><b>4</b><span data-i18n="save"></span></button><span class="local-badge"><i></i><span data-i18n="local"></span></span></nav>
  <main class="workspace">
    <aside class="tools-panel">
      <div class="panel-title"><span class="eyebrow">KANTURA · powered by RTAB-Map</span><h1 data-i18n="workspace"></h1></div>
      <button id="open" class="open-button"><span data-icon="folder"></span><span data-i18n="open"></span><span class="plus">+</span></button>
      <p class="file-types" data-i18n="openHint"></p>
      <input id="file" type="file" accept=".zip,.json,.obj,.mtl,.ply,.glb,.png,.jpg,.jpeg,.webp,.bmp,.bin" multiple hidden>
      <p class="privacy" data-i18n="roomplanHelp"></p>
      <div class="tool-group" role="group" aria-label="Measurement tools">
        <button class="tool" data-mode="distance"><span data-icon="ruler"></span><span data-i18n="distance"></span><kbd>1</kbd></button>
        <button class="tool" data-mode="floor"><span data-icon="floor"></span><span data-i18n="floor"></span><kbd>2</kbd></button>
        <button class="tool" data-mode="surface"><span data-icon="surface"></span><span data-i18n="surface"></span><kbd>3</kbd></button>
        <button class="tool" data-mode="note"><span data-icon="target"></span><span data-i18n="noteAdd"></span><kbd>4</kbd></button>
      </div>
      <div id="selection-actions" hidden><button id="finish" class="primary full" data-i18n="finish"></button><div class="button-row"><button id="undo" data-i18n="undo"></button><button id="cancel" data-i18n="cancel"></button></div></div>
      <div class="divider"></div>
      <label class="field"><span data-i18n="projectName"></span><input id="project-name" maxlength="200" value=""></label>
      <details class="settings" id="building-settings"><summary data-i18n="rooms"></summary><label class="field"><span data-i18n="buildingName"></span><input id="building-name" maxlength="200"></label><label class="field"><span data-i18n="floorName"></span><input id="floor-name" maxlength="100"></label><label class="field"><span data-i18n="roomName"></span><select id="room-select"></select></label><button id="add-room" class="full" data-i18n="addRoom"></button><p class="privacy" data-i18n="buildingHelp"></p></details>
      <details class="settings"><summary data-i18n="scale"></summary><label class="field"><span data-i18n="units"></span><select id="units"><option value="1" data-i18n="meters"></option><option value="0.01" data-i18n="centimeters"></option><option value="0.001" data-i18n="millimeters"></option></select></label><label class="field"><span data-i18n="axis"></span><select id="axis"><option value="z" data-i18n="upZ"></option><option value="y" data-i18n="upY"></option></select></label><button id="calibrate" class="full"><span data-icon="target"></span><span data-i18n="calibrate"></span></button></details>
      <div id="scale-status" class="scale-note"></div>
      <button id="verify" class="full" data-i18n="verification"></button>
      <button id="transport" class="full" data-i18n="transport"></button>
      <button id="cloud" class="cloud-button"><span data-icon="cloud"></span><span data-i18n="storage"></span><span>↗</span></button>
      <p class="privacy" data-i18n="fileHint"></p>
    </aside>
    <section class="model-panel">
      <div class="view-toolbar"><div class="segmented"><button id="orbit" class="active"><span data-icon="cube"></span><span>3D</span></button><button id="top"><span data-icon="floor"></span><span data-i18n="top"></span></button></div><div class="view-tools"><button id="texture" title="Texture"><span data-icon="image"></span><span data-i18n="texture"></span></button><button id="roof"><span data-icon="layers"></span><span data-i18n="roof"></span></button><button id="fit"><span data-icon="fit"></span><span data-i18n="fit"></span></button></div></div>
      <div id="stage" aria-label="3D viewport"></div>
      <div id="empty-overlay"><div class="hero-icon" data-icon="cube"></div><p class="eyebrow">SCAN → MEASURE</p><h2 data-i18n="importTitle"></h2><p data-i18n="importBody"></p><button id="open-hero" class="primary"><span data-icon="folder"></span><span data-i18n="open"></span></button><button id="demo" class="text-button" data-i18n="demo"></button></div>
      <div id="model-name" class="model-name" hidden></div><div id="demo-badge" class="demo-badge" hidden data-i18n="demoLabel"></div>
      <div class="viewer-footer"><span id="instruction"></span><span id="point-count"></span></div>
    </section>
    <aside class="results-panel"><div class="results-header"><span class="eyebrow" data-i18n="summary"></span><h2><span data-i18n="measurements"></span><span id="measure-count">0</span></h2></div><div id="results-empty"><span data-icon="ruler"></span><p data-i18n="empty"></p></div><ol id="measure-list"></ol><details class="results-section"><summary><span data-i18n="notes"></span> <span id="note-count">0</span></summary><p id="notes-empty" class="privacy" data-i18n="noteEmpty"></p><ul id="note-list"></ul></details><details class="results-section"><summary data-i18n="verification"></summary><p id="checks-empty" class="privacy" data-i18n="verificationEmpty"></p><ul id="check-list"></ul></details><div class="report-actions"><button id="report" disabled><span data-icon="book"></span><span data-i18n="exportReport"></span></button><button id="dxf" disabled><span data-icon="floor"></span><span data-i18n="exportDxf"></span></button><button id="csv" disabled><span data-icon="download"></span><span data-i18n="exportCsv"></span></button><button id="svg" disabled><span data-icon="floor"></span><span data-i18n="exportSvg"></span></button></div></aside>
  </main>
  <div id="status" role="status" aria-live="polite"></div>
  <dialog id="video-dialog" class="video-dialog"><div class="dialog-heading"><div><span class="eyebrow" data-i18n="learn"></span><h2 id="video-title"></h2></div><button data-close="video-dialog" class="icon-button">×</button></div><p id="video-description"></p><video id="explainer-video" controls playsinline preload="metadata" poster="./videos/poster.svg"></video><p id="video-error" class="privacy" data-i18n="videoUnavailable" hidden></p><div class="video-links"><a id="video-download" download data-i18n="videoDownload"></a><a id="caption-download" download data-i18n="subtitleDownload"></a></div><details class="video-transcript"><summary data-i18n="videoTranscript"></summary><ol id="video-transcript"></ol></details></dialog>
  <dialog id="guide-dialog"><div class="dialog-heading"><span class="eyebrow" id="guide-subtitle"></span><button data-close="guide-dialog" class="icon-button" aria-label="Close">×</button></div><div id="guide-illustration"></div><div class="guide-progress" id="guide-progress"></div><h2 id="guide-title"></h2><p id="guide-body"></p><div class="dialog-footer"><button id="guide-back" data-i18n="back"></button><span id="guide-counter"></span><button id="guide-next" class="primary" data-i18n="next"></button></div></dialog>
  <dialog id="reference-dialog"><div class="dialog-heading"><h2 data-i18n="reference"></h2><button data-close="reference-dialog" class="icon-button" aria-label="Close">×</button></div><form id="reference-form"><label class="field"><span data-i18n="known"></span><input id="reference-length" type="number" min="0.000001" step="any" required></label><button class="primary full" data-i18n="apply"></button></form></dialog>
  <dialog id="note-dialog"><div class="dialog-heading"><h2 data-i18n="note"></h2><button data-close="note-dialog" class="icon-button">×</button></div><form id="note-form"><label class="field"><span data-i18n="noteTitle"></span><input id="note-title" maxlength="200" required></label><label class="field"><span data-i18n="noteKind"></span><select id="note-kind"><option value="other" data-i18n="kindOther"></option><option value="door" data-i18n="kindDoor"></option><option value="window" data-i18n="kindWindow"></option><option value="gate" data-i18n="kindGate"></option><option value="wall" data-i18n="kindWall"></option></select></label><label class="field"><span data-i18n="noteDescription"></span><textarea id="note-description" maxlength="4000" rows="4"></textarea></label><label class="field"><span data-i18n="notePhoto"></span><input id="note-photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="privacy" data-i18n="notePhotoHint"></p><img id="note-preview" alt="" hidden><div class="button-row"><button id="note-photo-remove" type="button" data-i18n="notePhotoRemove"></button><button id="note-submit" class="primary" data-i18n="noteSave"></button></div></form></dialog>
  <dialog id="check-dialog"><div class="dialog-heading"><h2 data-i18n="verification"></h2><button data-close="check-dialog" class="icon-button">×</button></div><p data-i18n="verificationHelp"></p><form id="check-form"><label class="field"><span data-i18n="verificationMeasured"></span><select id="check-measurement" required></select></label><label class="field"><span data-i18n="verificationReference"></span><input id="check-known" type="number" min="0.000001" step="any" required></label><button class="primary full" data-i18n="verificationAdd"></button></form><p class="privacy" data-i18n="verificationNotCertification"></p></dialog>
  <dialog id="transport-dialog" class="transport-dialog"><div class="dialog-heading"><h2 data-i18n="transport"></h2><button data-close="transport-dialog" class="icon-button">×</button></div><p data-i18n="transportHelp"></p><label class="field"><span data-i18n="modelSearch"></span><input id="model-search" type="search" autocomplete="off"></label><p class="privacy" data-i18n="catalogHelp"></p><ul id="catalog-results"></ul><p id="catalog-source" class="privacy"></p><form id="transport-form"><div class="transport-fields"><fieldset><legend data-i18n="manualDimensions"></legend><label class="field"><span data-i18n="objectWidth"></span><input id="object-width" type="number" value="0.6" min="0.01" max="20" step="any" required></label><label class="field"><span data-i18n="objectDepth"></span><input id="object-depth" type="number" value="0.7" min="0.01" max="20" step="any" required></label><label class="field"><span data-i18n="objectHeight"></span><input id="object-height" type="number" value="2" min="0.01" max="20" step="any" required></label></fieldset><fieldset><legend data-i18n="verificationMeasured"></legend><label class="field"><span data-i18n="routeWidth"></span><input id="route-width" type="number" value="0.9" min="0.01" max="20" step="any" required></label><label class="field"><span data-i18n="routeCeiling"></span><input id="route-ceiling" type="number" value="2.3" min="0.01" max="20" step="any" required></label><label class="field"><span data-i18n="landingWidth"></span><input id="landing-width" type="number" value="1.1" min="0.01" max="20" step="any" required></label><label class="field"><span data-i18n="landingDepth"></span><input id="landing-depth" type="number" value="1.1" min="0.01" max="20" step="any" required></label></fieldset><fieldset><legend data-i18n="simulate"></legend><label class="field"><span data-i18n="stairRise"></span><input id="stair-rise" type="number" value="0.18" min="0" max="2" step="any" required></label><label class="field"><span data-i18n="stairRun"></span><input id="stair-run" type="number" value="0.28" min="0.01" max="5" step="any" required></label><label class="field"><span data-i18n="turnAngle"></span><select id="turn-angle"><option value="0">0°</option><option value="90" selected>90°</option><option value="180">180°</option></select></label><label class="field"><span data-i18n="margin"></span><input id="transport-margin" type="number" value="0.05" min="0" max="1" step="any" required></label><label class="checkbox-field"><input id="allow-tilt" type="checkbox"><span data-i18n="allowTilt"></span></label></fieldset></div><button class="primary full" data-i18n="simulate"></button></form><div id="transport-result" role="status" hidden></div><select id="transport-scenario" aria-label="Simulation" hidden></select><canvas id="transport-canvas" width="600" height="340" hidden></canvas><input id="transport-step" aria-label="Simulation" type="range" min="0" value="0" hidden></dialog>
  <dialog id="cloud-dialog"><div class="dialog-heading"><h2 data-i18n="storage"></h2><button data-close="cloud-dialog" class="icon-button" aria-label="Close">×</button></div><p data-i18n="cloudHelp"></p><div class="provider-tabs"><button data-provider="microsoft">OneDrive</button><button data-provider="google">Google Drive</button><button data-provider="server" data-i18n="selfhost"></button></div><div id="server-config" hidden><label class="field"><span data-i18n="serverKey"></span><input id="server-token" type="password" autocomplete="off" spellcheck="false"></label></div><details id="cloud-config"><summary data-i18n="configure"></summary><p data-i18n="configureHelp"></p><label class="field"><span data-i18n="googleId"></span><input id="google-id" autocomplete="off"></label><label class="field"><span data-i18n="microsoftId"></span><input id="microsoft-id" autocomplete="off"></label><button id="save-config" data-i18n="configSave"></button></details><div class="button-row"><button id="connect" class="primary" data-i18n="connect"></button><button id="disconnect" data-i18n="disconnect"></button><button id="refresh" data-i18n="refresh"></button></div><button id="upload" class="full" data-i18n="upload" disabled></button><progress id="upload-progress" max="1" value="0" hidden></progress><p id="cloud-status" role="status"></p><p id="provider-help" class="privacy" data-i18n="cloudScope"></p><ul id="cloud-files"></ul></dialog>
  <script type="module" src="./main.js"></script>
</body></html>
